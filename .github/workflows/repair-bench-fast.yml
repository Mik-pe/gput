name: repair benchmark fast

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Patch the two rejected bytes of dignity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/bin/gput-bench.rs")
          source = path.read_text()

          old_import = "use anyhow::{Context, Result, bail, ensure};"
          new_import = "use anyhow::{Context, Result, ensure};"
          if source.count(old_import) != 1:
              raise SystemExit("expected exactly one dead bail import")
          source = source.replace(old_import, new_import)

          old_line = '        let response = b"HTTP/1.1 200 OK\\r\\nContent-Length: 9000\\r\\nX-Gput-Backend: cpu\\r\\n\\r\\nok\\n";'
          new_line = '''        let response =
            b"HTTP/1.1 200 OK\\r\\nContent-Length: 9000\\r\\nX-Gput-Backend: cpu\\r\\n\\r\\nok\\n";'''
          if source.count(old_line) != 1:
              raise SystemExit("expected exactly one rustfmt line")
          source = source.replace(old_line, new_line)

          path.write_text(source)
          PY

          ! grep -q 'Result, bail' src/bin/gput-bench.rs
          grep -q '^        let response =$' src/bin/gput-bench.rs

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/bin/gput-bench.rs
          git diff --cached --check
          git commit -m "fix: remove the speedometer lint dust"
          git push origin HEAD:main
