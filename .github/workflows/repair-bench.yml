name: repair benchmark formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Remove the dead import and format the benchmark
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/bin/gput-bench.rs")
          source = path.read_text()
          old = "use anyhow::{Context, Result, bail, ensure};"
          new = "use anyhow::{Context, Result, ensure};"
          if source.count(old) != 1:
              raise SystemExit("expected exactly one dead bail import")
          path.write_text(source.replace(old, new))
          PY

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Format and validate
        run: |
          cargo +1.97.1 fmt --all
          cargo +1.97.1 fmt --check
          cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --locked --all-features
          cargo +1.97.1 build --locked --bins

      - name: Exercise CPU benchmark path
        run: GPUT_SMOKE_PORT=18084 bash scripts/smoke.sh cpu target/debug/gput

      - name: Install software Vulkan adapter
        run: |
          if ! find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit | grep --quiet .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
          fi

      - name: Exercise Vulkan benchmark path
        shell: bash
        run: |
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          runtime_dir="$(mktemp -d)"
          chmod 700 "$runtime_dir"
          trap 'rm -rf "$runtime_dir"' EXIT
          env \
            GPUT_SMOKE_PORT=18085 \
            WGPU_BACKEND=vulkan \
            VK_DRIVER_FILES="$lvp_icd" \
            VK_ICD_FILENAMES="$lvp_icd" \
            XDG_RUNTIME_DIR="$runtime_dir" \
            LIBGL_ALWAYS_SOFTWARE=true \
            GALLIUM_DRIVER=llvmpipe \
          bash scripts/smoke.sh gpu target/debug/gput

      - name: Commit the clean benchmark directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/bin/gput-bench.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: make the speedometer warning-free"
          git push origin HEAD:main
