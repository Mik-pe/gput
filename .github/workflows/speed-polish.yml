name: land allocation and readback surgery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/speed-polish.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: gput-speed-polish
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark optimization pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=gput/speed-polish \
            -f description='removing allocations and redundant GPU readback waits' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Install Rust and Lavapipe
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          if ! find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit \
            2>/dev/null | grep --quiet .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
          fi

      - name: Build and measure the current packet engine
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 build --release --locked \
            --bin gput-packet-bench \
            --bin gput-packet-demo
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          chmod 700 "$runtime_dir"
          env \
            WGPU_BACKEND=vulkan \
            VK_DRIVER_FILES="$lvp_icd" \
            VK_ICD_FILENAMES="$lvp_icd" \
            XDG_RUNTIME_DIR="$runtime_dir" \
            LIBGL_ALWAYS_SOFTWARE=true \
            GALLIUM_DRIVER=llvmpipe \
            target/release/gput-packet-bench \
              --backend both \
              --flows 64 \
              --requests-per-flow 16 \
              --warmup-requests-per-flow 2 \
              --batch-size 64 \
              --flow-capacity 256 \
              --flow-probe-limit 64 \
              --json > /tmp/gput-before.json
          cat /tmp/gput-before.json

      - name: Apply the hot-path cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              if old not in source:
                  raise SystemExit(f"expected block not found in {path}: {old[:100]!r}")
              file.write_text(source.replace(old, new, 1))

          packet = Path("src/packet/mod.rs")
          source = packet.read_text()
          source = source.replace(
              "mod cpu;\n",
              '#[cfg(target_endian = "big")]\ncompile_error!("gput packet packing currently requires a little-endian host");\n\nmod cpu;\n',
              1,
          )
          source = source.replace(
              "    sync::atomic::{AtomicU64, Ordering},\n",
              "    sync::{\n        Mutex,\n        atomic::{AtomicU64, Ordering},\n    },\n",
              1,
          )
          marker = "#[derive(Debug, Clone, PartialEq, Eq)]\npub struct RawPacket"
          scratch = """#[derive(Default)]
          struct PacketScratch {
              metadata: Vec<PacketMeta>,
              words: Vec<u32>,
          }

          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct RawPacket"""
          if marker not in source:
              raise SystemExit("packet scratch insertion marker missing")
          source = source.replace(marker, scratch, 1)
          source = source.replace(
              "    packets: AtomicU64,\n}",
              "    packets: AtomicU64,\n    scratch: Mutex<PacketScratch>,\n}",
              1,
          )
          source = source.replace(
              "            packets: AtomicU64::new(0),\n        })",
              "            packets: AtomicU64::new(0),\n            scratch: Mutex::new(PacketScratch::default()),\n        })",
              1,
          )
          old_dispatch = """    fn dispatch_wave(&self, packets: &[&RawPacket]) -> Result<Vec<Option<RawPacket>>> {
              if packets.is_empty() {
                  return Ok(Vec::new());
              }
              let packet_count = packets.len();
              let mut metadata = vec![PacketMeta::zeroed(); packet_count];
              let mut words = vec![0_u32; packet_count * PACKET_WORDS];
              for (packet_index, packet) in packets.iter().enumerate() {
                  metadata[packet_index].len = packet.bytes.len() as u32;
                  let base = packet_index * PACKET_WORDS;
                  pack_packet(&packet.bytes, &mut words[base..base + PACKET_WORDS]);
              }
          """
          new_dispatch = """    fn dispatch_wave(
              &self,
              packets: &[RawPacket],
              wave: &[usize],
              scratch: &mut PacketScratch,
          ) -> Result<Vec<Option<RawPacket>>> {
              if wave.is_empty() {
                  return Ok(Vec::new());
              }
              let packet_count = wave.len();
              scratch.metadata.resize(packet_count, PacketMeta::zeroed());
              scratch.words.resize(packet_count * PACKET_WORDS, 0);
              for (packet_index, source_index) in wave.iter().copied().enumerate() {
                  let packet = &packets[source_index];
                  scratch.metadata[packet_index].len = packet.bytes.len() as u32;
                  let base = packet_index * PACKET_WORDS;
                  pack_packet(
                      &packet.bytes,
                      &mut scratch.words[base..base + PACKET_WORDS],
                  );
              }
          """
          if old_dispatch not in source:
              raise SystemExit("packet dispatch allocation block missing")
          source = source.replace(old_dispatch, new_dispatch, 1)
          source = source.replace(
              "bytemuck::cast_slice(&metadata)",
              "bytemuck::cast_slice(&scratch.metadata)",
              1,
          )
          source = source.replace(
              "bytemuck::cast_slice(&words)",
              "bytemuck::cast_slice(&scratch.words)",
              1,
          )
          source = source.replace(
              """        let meta_bytes = map_read(&self.device, &self.readback_meta, meta_copy_bytes)?;
                  let word_bytes = map_read(&self.device, &self.readback_words, word_copy_bytes)?;
          """,
              """        let (meta_bytes, word_bytes) = map_two_reads(
                      &self.device,
                      &self.readback_meta,
                      meta_copy_bytes,
                      &self.readback_words,
                      word_copy_bytes,
                  )?;
          """,
              1,
          )
          old_process = """        let waves = schedule_waves(packets, self.config.max_batch_size);
                  let mut output = vec![None; packets.len()];
                  for wave in waves {
                      let inputs = wave
                          .iter()
                          .map(|index| &packets[*index])
                          .collect::<Vec<_>>();
                      let wave_output = self.dispatch_wave(&inputs)?;
                      for (index, packet) in wave.into_iter().zip(wave_output) {
                          output[index] = packet;
                      }
                  }
          """
          new_process = """        let waves = schedule_waves(packets, self.config.max_batch_size);
                  let mut output = vec![None; packets.len()];
                  let mut scratch = self
                      .scratch
                      .lock()
                      .map_err(|_| anyhow::anyhow!("GPU packet scratch buffer poisoned"))?;
                  for wave in waves {
                      let wave_output = self.dispatch_wave(packets, &wave, &mut scratch)?;
                      for (index, packet) in wave.into_iter().zip(wave_output) {
                          output[index] = packet;
                      }
                  }
          """
          if old_process not in source:
              raise SystemExit("packet wave processing block missing")
          source = source.replace(old_process, new_process, 1)
          old_map = """fn map_read(device: &wgpu::Device, buffer: &wgpu::Buffer, size: u64) -> Result<wgpu::BufferView> {
              let slice = buffer.slice(0..size);
              let (sender, receiver) = std::sync::mpsc::channel();
              slice.map_async(wgpu::MapMode::Read, move |result| {
                  let _ = sender.send(result);
              });
              device.poll(wgpu::PollType::wait_indefinitely())?;
              receiver
                  .recv()
                  .context("GPU readback callback disappeared")??;
              Ok(slice.get_mapped_range()?)
          }
          """
          new_map = """fn map_two_reads(
              device: &wgpu::Device,
              first_buffer: &wgpu::Buffer,
              first_size: u64,
              second_buffer: &wgpu::Buffer,
              second_size: u64,
          ) -> Result<(wgpu::BufferView, wgpu::BufferView)> {
              let first_slice = first_buffer.slice(0..first_size);
              let second_slice = second_buffer.slice(0..second_size);
              let (first_sender, first_receiver) = std::sync::mpsc::sync_channel(1);
              let (second_sender, second_receiver) = std::sync::mpsc::sync_channel(1);
              first_slice.map_async(wgpu::MapMode::Read, move |result| {
                  let _ = first_sender.send(result);
              });
              second_slice.map_async(wgpu::MapMode::Read, move |result| {
                  let _ = second_sender.send(result);
              });
              device.poll(wgpu::PollType::wait_indefinitely())?;

              let first_result = first_receiver
                  .recv()
                  .context("first GPU readback callback disappeared")?;
              let second_result = second_receiver
                  .recv()
                  .context("second GPU readback callback disappeared")?;
              if let Err(error) = first_result {
                  if second_result.is_ok() {
                      second_buffer.unmap();
                  }
                  anyhow::bail!("mapping first GPU readback failed: {error}");
              }
              if let Err(error) = second_result {
                  first_buffer.unmap();
                  anyhow::bail!("mapping second GPU readback failed: {error}");
              }

              let first = first_slice.get_mapped_range()?;
              let second = match second_slice.get_mapped_range() {
                  Ok(second) => second,
                  Err(error) => {
                      drop(first);
                      first_buffer.unmap();
                      second_buffer.unmap();
                      return Err(error.into());
                  }
              };
              Ok((first, second))
          }
          """
          if old_map not in source:
              raise SystemExit("serial packet readback helper missing")
          source = source.replace(old_map, new_map, 1)
          source = source.replace(
              """fn pack_packet(bytes: &[u8], words: &mut [u32]) {
              words.fill(0);
              for (index, byte) in bytes.iter().copied().enumerate() {
                  words[index / 4] |= u32::from(byte) << ((index % 4) * 8);
              }
          }

          fn unpack_packet(words: &[u32], len: usize) -> Vec<u8> {
              (0..len)
                  .map(|index| ((words[index / 4] >> ((index % 4) * 8)) & 0xff) as u8)
                  .collect()
          }
          """,
              """fn pack_packet(bytes: &[u8], words: &mut [u32]) {
              let destination: &mut [u8] = bytemuck::cast_slice_mut(words);
              destination[..bytes.len()].copy_from_slice(bytes);
          }

          fn unpack_packet(words: &[u32], len: usize) -> Vec<u8> {
              let bytes: &[u8] = bytemuck::cast_slice(words);
              bytes[..len].to_vec()
          }
          """,
              1,
          )
          packet.write_text(source)

          processor = Path("src/processor/gpu.rs")
          source = processor.read_text()
          source = source.replace(
              "    response_stride_words: usize,\n}",
              "    response_stride_words: usize,\n    request_meta_scratch: Vec<RequestMeta>,\n    input_words_scratch: Vec<u32>,\n}",
              1,
          )
          source = source.replace(
              """            response_stride_words,
                  })
          """,
              """            response_stride_words,
                      request_meta_scratch: Vec::with_capacity(limits.max_batch_size),
                      input_words_scratch: Vec::with_capacity(
                          limits.max_batch_size * request_stride_words,
                      ),
                  })
          """,
              1,
          )
          source = source.replace(
              """        let request_count = requests.len();
                  let mut input_words = vec![0_u32; request_count * self.request_stride_words];
                  let mut request_meta = Vec::with_capacity(request_count);
          """,
              """        let request_count = requests.len();
                  self.input_words_scratch
                      .resize(request_count * self.request_stride_words, 0);
                  self.request_meta_scratch.clear();
          """,
              1,
          )
          source = source.replace("&mut input_words[", "&mut self.input_words_scratch[", 1)
          source = source.replace("            request_meta.push(RequestMeta {", "            self.request_meta_scratch.push(RequestMeta {", 1)
          source = source.replace(
              "bytemuck::cast_slice(&request_meta)",
              "bytemuck::cast_slice(&self.request_meta_scratch)",
              1,
          )
          source = source.replace(
              "bytemuck::cast_slice(&input_words)",
              "bytemuck::cast_slice(&self.input_words_scratch)",
              1,
          )
          source = source.replace(
              """fn pack_request_words(request: &[u8], destination: &mut [u32]) {
              destination.fill(0);

              for (byte_index, byte) in request.iter().copied().enumerate() {
                  let word_index = byte_index / 4;
                  let shift = (byte_index % 4) * 8;
                  destination[word_index] |= u32::from(byte) << shift;
              }
          }
          """,
              """fn pack_request_words(request: &[u8], destination: &mut [u32]) {
              let destination: &mut [u8] = bytemuck::cast_slice_mut(destination);
              destination[..request.len()].copy_from_slice(request);
          }
          """,
              1,
          )
          processor.write_text(source)

          replace_once(
              "src/network.rs",
              """            let remainder = pending.split_off(header_len);
                          let request = std::mem::replace(pending, remainder);
                          return Ok(Some(request));
          """,
              """            let request = pending.drain(..header_len).collect::<Vec<_>>();
                          return Ok(Some(request));
          """,
          )

          batcher = Path("src/batcher.rs")
          source = batcher.read_text()
          source = source.replace(
              """fn worker_loop(
              mut processor: Box<dyn Processor>,
              receiver: Receiver<Job>,
              config: BatcherConfig,
              metrics: Arc<BatcherMetrics>,
          ) {
              while let Ok(first) = receiver.recv() {
          """,
              """fn worker_loop(
              mut processor: Box<dyn Processor>,
              receiver: Receiver<Job>,
              config: BatcherConfig,
              metrics: Arc<BatcherMetrics>,
          ) {
              let mut jobs = Vec::with_capacity(config.max_batch_size);
              let mut requests = Vec::with_capacity(config.max_batch_size);

              while let Ok(first) = receiver.recv() {
          """,
              1,
          )
          source = source.replace(
              """        let mut jobs = Vec::with_capacity(config.max_batch_size);
                  jobs.push(first);
          """,
              """        jobs.clear();
                  requests.clear();
                  jobs.push(first);
          """,
              1,
          )
          source = source.replace(
              """        let result = {
                      let requests = jobs
                          .iter()
                          .map(|job| job.request.as_slice())
                          .collect::<Vec<_>>();
                      processor.process_batch(&requests)
                  };
          """,
              """        requests.extend(jobs.iter().map(|job| job.request.as_slice()));
                  let result = processor.process_batch(&requests);
          """,
              1,
          )
          source = source.replace(
              "for (job, response) in jobs.into_iter().zip(responses)",
              "for (job, response) in jobs.drain(..).zip(responses)",
              1,
          )
          source = source.replace("fail_batch(jobs, message, &metrics);", "fail_batch(&mut jobs, message, &metrics);", 1)
          source = source.replace("fail_batch(jobs, processing_error.to_string().into(), &metrics);", "fail_batch(&mut jobs, processing_error.to_string().into(), &metrics);", 1)
          source = source.replace(
              "fn fail_batch(jobs: Vec<Job>, message: Arc<str>, metrics: &BatcherMetrics) {",
              "fn fail_batch(jobs: &mut Vec<Job>, message: Arc<str>, metrics: &BatcherMetrics) {",
              1,
          )
          source = source.replace("    for job in jobs {", "    for job in jobs.drain(..) {", 1)
          batcher.write_text(source)

          cpu = Path("src/packet/cpu.rs")
          source = cpu.read_text()
          source = source.replace("use std::{\n    collections::HashMap,", "use std::{\n    collections::HashMap,", 1)
          source = source.replace(
              "        sync::{\n        Mutex,\n        atomic::{AtomicU64, Ordering},\n    },",
              "        sync::{\n        Mutex, OnceLock,\n        atomic::{AtomicU64, Ordering},\n    },",
              1,
          )
          source = source.replace("            let response = cpu_response(last.response_id);", "            let response = cpu_response(last.response_id);", 1)
          source = source.replace("                &response,", "                response,", 1)
          source = source.replace("    let response = cpu_response(response_id);", "    let response = cpu_response(response_id);", 1)
          source = source.replace("        &response,", "        response,", 1)
          old_cpu_response = """fn cpu_response(response_id: u32) -> Vec<u8> {
              let mut response = packet_response(response_id).to_vec();
              if let Some(offset) = response
                  .windows(b"gpu-packet".len())
                  .position(|window| window == b"gpu-packet")
              {
                  response[offset..offset + b"cpu-packet".len()].copy_from_slice(b"cpu-packet");
              }
              response
          }
          """
          new_cpu_response = """fn cpu_response(response_id: u32) -> &'static [u8] {
              static RESPONSES: OnceLock<Vec<Vec<u8>>> = OnceLock::new();
              let responses = RESPONSES.get_or_init(|| {
                  (0..super::PACKET_RESPONSES.len())
                      .map(|index| {
                          let mut response = packet_response(index as u32).to_vec();
                          if let Some(offset) = response
                              .windows(b"gpu-packet".len())
                              .position(|window| window == b"gpu-packet")
                          {
                              response[offset..offset + b"cpu-packet".len()]
                                  .copy_from_slice(b"cpu-packet");
                          }
                          response
                      })
                      .collect()
              });
              responses
                  .get(response_id as usize)
                  .unwrap_or(&responses[super::RESPONSE_BAD_REQUEST as usize])
                  .as_slice()
          }
          """
          if old_cpu_response not in source:
              raise SystemExit("CPU response allocation helper missing")
          source = source.replace(old_cpu_response, new_cpu_response, 1)
          cpu.write_text(source)

          ci = Path(".github/workflows/ci.yml")
          source = ci.read_text()
          needle = """                run_check "GPU TCP retransmission, routing and collision proof" \\
                  env \\
          """
          doctor = """                run_check "GPU doctor through Lavapipe" \\
                  env \\
                    WGPU_BACKEND=vulkan \\
                    VK_DRIVER_FILES="$lvp_icd" \\
                    VK_ICD_FILENAMES="$lvp_icd" \\
                    XDG_RUNTIME_DIR="$runtime_dir" \\
                    LIBGL_ALWAYS_SOFTWARE=true \\
                    GALLIUM_DRIVER=llvmpipe \\
                  target/debug/gput-doctor

          """
          if needle not in source:
              raise SystemExit("CI packet-proof insertion marker missing")
          ci.write_text(source.replace(needle, doctor + needle, 1))
          PY

      - name: Format, lint, test, and rebuild
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt
          cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --locked --all-features
          cargo +1.97.1 build --release --locked --bins

      - name: Prove semantics and measure the optimized engine
        shell: bash
        run: |
          set -euo pipefail
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          chmod 700 "$runtime_dir"
          env \
            WGPU_BACKEND=vulkan \
            VK_DRIVER_FILES="$lvp_icd" \
            VK_ICD_FILENAMES="$lvp_icd" \
            XDG_RUNTIME_DIR="$runtime_dir" \
            LIBGL_ALWAYS_SOFTWARE=true \
            GALLIUM_DRIVER=llvmpipe \
            target/release/gput-doctor
          env \
            WGPU_BACKEND=vulkan \
            VK_DRIVER_FILES="$lvp_icd" \
            VK_ICD_FILENAMES="$lvp_icd" \
            XDG_RUNTIME_DIR="$runtime_dir" \
            LIBGL_ALWAYS_SOFTWARE=true \
            GALLIUM_DRIVER=llvmpipe \
            target/release/gput-packet-demo
          env \
            WGPU_BACKEND=vulkan \
            VK_DRIVER_FILES="$lvp_icd" \
            VK_ICD_FILENAMES="$lvp_icd" \
            XDG_RUNTIME_DIR="$runtime_dir" \
            LIBGL_ALWAYS_SOFTWARE=true \
            GALLIUM_DRIVER=llvmpipe \
            target/release/gput-packet-bench \
              --backend both \
              --flows 64 \
              --requests-per-flow 16 \
              --warmup-requests-per-flow 2 \
              --batch-size 64 \
              --flow-capacity 256 \
              --flow-probe-limit 64 \
              --json > /tmp/gput-after.json
          cat /tmp/gput-after.json

          python3 - <<'PY'
          import json

          with open("/tmp/gput-before.json", encoding="utf-8") as source:
              before = {row["backend"]: row for row in json.load(source)["results"]}
          with open("/tmp/gput-after.json", encoding="utf-8") as source:
              after = {row["backend"]: row for row in json.load(source)["results"]}

          for backend in ("cpu-packet", "gpu-packet"):
              old = before[backend]["engine_requests_per_second"]
              new = after[backend]["engine_requests_per_second"]
              print(f"{backend}: {old:.0f} -> {new:.0f} engine req/s ({new / old:.3f}x)")
          PY

      - name: Publish the validated optimization directly to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/speed-polish.yml
          git add -- \
            .github/workflows/ci.yml \
            src/batcher.rs \
            src/network.rs \
            src/packet/cpu.rs \
            src/packet/mod.rs \
            src/processor/gpu.rs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "perf: reuse staging memory and collapse GPU readback waits"
          git push origin HEAD:main
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark optimized commit green
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.publish.outputs.new_sha }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${NEW_SHA}" \
            -f state=success \
            -f context=gput/speed-polish \
            -f description='scratch reuse, memcpy packing, one packet readback wait, full gauntlet passed' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Dispatch permanent Linux, packet, and macOS checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/packet-proof.yml/dispatches" -f ref=main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/macos.yml/dispatches" -f ref=main

      - name: Mark failed optimization red
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=gput/speed-polish \
            -f description='optimization preflight failed; inspect the linked run' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
