name: repair benchmark formatting

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-benchmark-ci.yml

permissions:
  contents: write

concurrency:
  group: repair-benchmark-formatting
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply the Clippy fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/bin/gput-bench.rs")
          source = path.read_text()
          old = "if sorted.len() % 2 == 0 {"
          count = source.count(old)
          if count != 2:
              raise SystemExit(f"expected two median parity checks, found {count}")
          path.write_text(source.replace(old, "if sorted.len().is_multiple_of(2) {"))
          PY

      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Format the tree
        run: cargo +1.97.1 fmt

      - name: Commit the repaired benchmark directly to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-benchmark-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/bin/gput-bench.rs src/network.rs src/processor/shader_strings.rs .github/workflows/repair-benchmark-ci.yml
          git diff --cached --check
          git commit -m "fix: satisfy benchmark formatting and clippy"
          git push origin HEAD:main
