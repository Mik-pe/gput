name: land tight packet readback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tight-readback.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: gput-tight-readback
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark optimization pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=gput/tight-readback \
            -f description='replacing MTU-sized response furniture vans with tight packet slots' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Install Rust and Lavapipe
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          if ! find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit \
            2>/dev/null | grep --quiet .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
          fi

      - name: Measure the full-stride packet path
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 build --release --locked --bin gput-packet-bench
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          chmod 700 "$runtime_dir"
          env \
            WGPU_BACKEND=vulkan \
            VK_DRIVER_FILES="$lvp_icd" \
            VK_ICD_FILENAMES="$lvp_icd" \
            XDG_RUNTIME_DIR="$runtime_dir" \
            LIBGL_ALWAYS_SOFTWARE=true \
            GALLIUM_DRIVER=llvmpipe \
            target/release/gput-packet-bench \
              --backend gpu \
              --flows 256 \
              --requests-per-flow 512 \
              --warmup-requests-per-flow 8 \
              --batch-size 256 \
              --flow-capacity 1024 \
              --flow-probe-limit 64 \
              --json > /tmp/gput-wide.json
          cat /tmp/gput-wide.json

      - name: Tighten output slots and combine readback
        run: python3 scripts/tight-readback.py

      - name: Format, lint, test and build every binary
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt
          cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --locked --all-features
          cargo +1.97.1 build --release --locked --bins

      - name: Prove semantics and measure the tight path
        shell: bash
        run: |
          set -euo pipefail
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          chmod 700 "$runtime_dir"
          common=(
            WGPU_BACKEND=vulkan
            VK_DRIVER_FILES="$lvp_icd"
            VK_ICD_FILENAMES="$lvp_icd"
            XDG_RUNTIME_DIR="$runtime_dir"
            LIBGL_ALWAYS_SOFTWARE=true
            GALLIUM_DRIVER=llvmpipe
          )
          env "${common[@]}" target/release/gput-doctor
          env "${common[@]}" target/release/gput-packet-demo
          env "${common[@]}" \
            target/release/gput-packet-bench \
              --backend gpu \
              --flows 256 \
              --requests-per-flow 512 \
              --warmup-requests-per-flow 8 \
              --batch-size 256 \
              --flow-capacity 1024 \
              --flow-probe-limit 64 \
              --json > /tmp/gput-tight.json
          cat /tmp/gput-tight.json

          python3 - <<'PY'
          import json

          with open('/tmp/gput-wide.json', encoding='utf-8') as source:
              before = json.load(source)['results'][0]
          with open('/tmp/gput-tight.json', encoding='utf-8') as source:
              after = json.load(source)['results'][0]

          old = before['engine_requests_per_second']
          new = after['engine_requests_per_second']
          print(f'gpu-packet: {old:.0f} -> {new:.0f} engine req/s ({new / old:.3f}x)')
          print('readback payload per packet: 1552 bytes -> 240 bytes (6.47x smaller)')
          assert before['requests'] == after['requests'] == 131072
          assert after['engine_requests_per_second'] > 0
          PY

      - name: Publish directly to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/tight-readback.yml \
            scripts/tight-readback.py
          git add -- \
            src/packet/mod.rs \
            src/packet/packet.wgsl
          git diff --cached --check
          git diff --cached --stat
          git commit -m "perf: shrink packet responses and map one readback buffer"
          git push origin HEAD:main
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark optimized commit green
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.publish.outputs.new_sha }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${NEW_SHA}" \
            -f state=success \
            -f context=gput/tight-readback \
            -f description='6.47x smaller packet readback, one map, full proof suite passed' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Dispatch permanent checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/packet-proof.yml/dispatches" -f ref=main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/macos.yml/dispatches" -f ref=main

      - name: Mark failed optimization red
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=gput/tight-readback \
            -f description='tight-readback preflight failed; inspect the linked run' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
