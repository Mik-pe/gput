name: land word-packed GPU packet responses

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/packet-word-fastpath.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: gput-packet-word-fastpath
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark shader optimization pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=gput/packet-word-fastpath \
            -f description='replacing byte weaving with aligned word copies and checksum constants' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Install Rust and Lavapipe
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          if ! find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit \
            2>/dev/null | grep --quiet .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
          fi

      - name: Build the baseline packet engine
        run: cargo +1.97.1 build --release --locked --bin gput-packet-bench

      - name: Measure the byte-at-a-time baseline five times
        shell: bash
        run: |
          set -euo pipefail
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          chmod 700 "$runtime_dir"
          for run in $(seq 1 5); do
            env \
              WGPU_BACKEND=vulkan \
              VK_DRIVER_FILES="$lvp_icd" \
              VK_ICD_FILENAMES="$lvp_icd" \
              XDG_RUNTIME_DIR="$runtime_dir" \
              LIBGL_ALWAYS_SOFTWARE=true \
              GALLIUM_DRIVER=llvmpipe \
              target/release/gput-packet-bench \
                --backend gpu \
                --flows 256 \
                --requests-per-flow 2048 \
                --warmup-requests-per-flow 16 \
                --batch-size 256 \
                --flow-capacity 1024 \
                --flow-probe-limit 64 \
                --json > "/tmp/gput-word-before-${run}.json"
          done

      - name: Repair bootstrap replacement escaping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/packet-word-fastpath.py")
          source = path.read_text()
          old = "updated, count = re.subn(pattern, replacement, source, count=1, flags=re.DOTALL)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, source, count=1, flags=re.DOTALL)"
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif "lambda _match: replacement" not in source:
              raise SystemExit("regex replacement helper is neither legacy nor repaired")
          PY

      - name: Apply aligned response templates and checksum sums
        run: python3 scripts/packet-word-fastpath.py

      - name: Format, lint, test, and rebuild everything
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt
          cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --locked --all-features
          cargo +1.97.1 build --release --locked --bins

      - name: Prove packet semantics and measure the word fast path five times
        shell: bash
        run: |
          set -euo pipefail
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          chmod 700 "$runtime_dir"
          common=(
            WGPU_BACKEND=vulkan
            VK_DRIVER_FILES="$lvp_icd"
            VK_ICD_FILENAMES="$lvp_icd"
            XDG_RUNTIME_DIR="$runtime_dir"
            LIBGL_ALWAYS_SOFTWARE=true
            GALLIUM_DRIVER=llvmpipe
          )

          env "${common[@]}" target/release/gput-doctor
          env "${common[@]}" target/release/gput-packet-demo

          for run in $(seq 1 5); do
            env "${common[@]}" \
              target/release/gput-packet-bench \
                --backend gpu \
                --flows 256 \
                --requests-per-flow 2048 \
                --warmup-requests-per-flow 16 \
                --batch-size 256 \
                --flow-capacity 1024 \
                --flow-probe-limit 64 \
                --json > "/tmp/gput-word-after-${run}.json"
          done

          python3 - <<'PY'
          import json
          import statistics

          def rows(prefix):
              values = []
              for run in range(1, 6):
                  with open(f'/tmp/{prefix}-{run}.json', encoding='utf-8') as source:
                      values.append(json.load(source)['results'][0])
              return values

          before = rows('gput-word-before')
          after = rows('gput-word-after')
          before_rps = [row['engine_requests_per_second'] for row in before]
          after_rps = [row['engine_requests_per_second'] for row in after]
          before_p99 = [row['p99_round_nanos'] for row in before]
          after_p99 = [row['p99_round_nanos'] for row in after]
          old = statistics.median(before_rps)
          new = statistics.median(after_rps)
          old_p99 = statistics.median(before_p99)
          new_p99 = statistics.median(after_p99)

          print('baseline engine req/s:', ', '.join(f'{value:.0f}' for value in before_rps))
          print('word-copy engine req/s:', ', '.join(f'{value:.0f}' for value in after_rps))
          print(f'median engine throughput: {old:.0f} -> {new:.0f} req/s ({new / old:.3f}x)')
          print(f'median p99 batch round: {old_p99 / 1e6:.3f} -> {new_p99 / 1e6:.3f} ms')

          assert new >= old * 1.02, (
              f'word fast path failed to clear the 2% noise floor: {old:.0f} -> {new:.0f}'
          )
          assert new_p99 <= old_p99 * 1.25, (
              f'p99 regressed too far: {old_p99} -> {new_p99}'
          )
          PY

      - name: Publish the validated shader fast path directly to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/packet-word-fastpath.yml \
            scripts/packet-word-fastpath.py
          git add -- \
            README.md \
            src/packet/mod.rs \
            src/packet/packet.wgsl
          git diff --cached --check
          git diff --cached --stat
          git commit -m "perf: word-pack packet responses and precompute payload checksums"
          git push origin HEAD:main
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark optimized commit green
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.publish.outputs.new_sha }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${NEW_SHA}" \
            -f state=success \
            -f context=gput/packet-word-fastpath \
            -f description='aligned response copies, constant payload sums, full proof and measured gain passed' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Dispatch permanent Linux, packet, and macOS checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/packet-proof.yml/dispatches" -f ref=main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/macos.yml/dispatches" -f ref=main

      - name: Mark failed shader optimization red
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=gput/packet-word-fastpath \
            -f description='packet word fast path failed; inspect the linked run' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
