name: repair cursed UTF-8

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-cursed-utf8.yml

permissions:
  actions: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply deterministic repair
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          shader = Path("src/processor/http.wgsl")
          source = shader.read_text(encoding="utf-8")
          replacements = [
              (
                  "    let meta = string_meta[string_id];\n",
                  "    let string_info = string_meta[string_id];\n",
              ),
              (
                  "byte_index >= meta.byte_len",
                  "byte_index >= string_info.byte_len",
              ),
              (
                  "scalar_count != meta.scalar_len",
                  "scalar_count != string_info.scalar_len",
              ),
          ]

          for before, after in replacements:
              if source.count(before) != 1:
                  raise SystemExit(
                      f"expected exactly one shader occurrence of {before!r}, "
                      f"found {source.count(before)}"
                  )
              source = source.replace(before, after)

          shader.write_text(source, encoding="utf-8")
          PY

          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          cargo +1.97.1 fmt --all
          cargo +1.97.1 fmt --check
          cargo +1.97.1 test --locked composed_shader_parses_and_validates
          git diff --check

      - name: Commit source repair
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/protocol.rs \
            src/processor/shader_strings.rs \
            src/processor/http.wgsl

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "fix: satisfy rustfmt and Naga"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch full CI for repaired main
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref main
