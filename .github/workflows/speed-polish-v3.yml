name: land indentation-safe speed surgery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/speed-polish-v3.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: gput-speed-polish
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark optimization pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=gput/speed-polish \
            -f description='measuring scratch reuse, memcpy packing and parallel readback' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Install toolchain and software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          if ! find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit \
            2>/dev/null | grep --quiet .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
          fi

      - name: Measure the unoptimized tree
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 build --release --locked --bin gput-packet-bench
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          chmod 700 "$runtime_dir"
          env \
            WGPU_BACKEND=vulkan \
            VK_DRIVER_FILES="$lvp_icd" \
            VK_ICD_FILENAMES="$lvp_icd" \
            XDG_RUNTIME_DIR="$runtime_dir" \
            LIBGL_ALWAYS_SOFTWARE=true \
            GALLIUM_DRIVER=llvmpipe \
            target/release/gput-packet-bench \
              --backend both \
              --flows 64 \
              --requests-per-flow 16 \
              --warmup-requests-per-flow 2 \
              --batch-size 64 \
              --flow-capacity 256 \
              --flow-probe-limit 64 \
              --json > /tmp/gput-before.json
          cat /tmp/gput-before.json

      - name: Apply hot-path cleanup
        run: python3 scripts/run-speed-polish.py

      - name: Format, lint, test and build everything
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt
          cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --locked --all-features
          cargo +1.97.1 build --release --locked --bins

      - name: Prove and measure the optimized tree
        shell: bash
        run: |
          set -euo pipefail
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          chmod 700 "$runtime_dir"
          common=(
            WGPU_BACKEND=vulkan
            VK_DRIVER_FILES="$lvp_icd"
            VK_ICD_FILENAMES="$lvp_icd"
            XDG_RUNTIME_DIR="$runtime_dir"
            LIBGL_ALWAYS_SOFTWARE=true
            GALLIUM_DRIVER=llvmpipe
          )
          env "${common[@]}" target/release/gput-doctor
          env "${common[@]}" target/release/gput-packet-demo
          env "${common[@]}" \
            target/release/gput-packet-bench \
              --backend both \
              --flows 64 \
              --requests-per-flow 16 \
              --warmup-requests-per-flow 2 \
              --batch-size 64 \
              --flow-capacity 256 \
              --flow-probe-limit 64 \
              --json > /tmp/gput-after.json
          cat /tmp/gput-after.json

          python3 - <<'PY'
          import json
          with open('/tmp/gput-before.json', encoding='utf-8') as source:
              before = {row['backend']: row for row in json.load(source)['results']}
          with open('/tmp/gput-after.json', encoding='utf-8') as source:
              after = {row['backend']: row for row in json.load(source)['results']}
          for backend in ('cpu-packet', 'gpu-packet'):
              old = before[backend]['engine_requests_per_second']
              new = after[backend]['engine_requests_per_second']
              print(f'{backend}: {old:.0f} -> {new:.0f} engine req/s ({new / old:.3f}x)')
          PY

      - name: Publish directly to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/speed-polish.yml \
            .github/workflows/speed-polish-v2.yml \
            .github/workflows/speed-polish-v3.yml \
            scripts/speed-polish.py \
            scripts/run-speed-polish.py
          git add -- \
            .github/workflows/ci.yml \
            src/batcher.rs \
            src/network.rs \
            src/packet/cpu.rs \
            src/packet/mod.rs \
            src/processor/gpu.rs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "perf: reuse staging memory and collapse GPU readback waits"
          git push origin HEAD:main
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark optimized commit green
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.publish.outputs.new_sha }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${NEW_SHA}" \
            -f state=success \
            -f context=gput/speed-polish \
            -f description='scratch reuse, memcpy packing and parallel readback passed the full gauntlet' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Dispatch permanent checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/packet-proof.yml/dispatches" -f ref=main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/macos.yml/dispatches" -f ref=main

      - name: Mark failed optimization red
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=gput/speed-polish \
            -f description='optimization preflight failed; inspect the linked run' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
