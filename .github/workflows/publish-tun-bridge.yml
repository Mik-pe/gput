name: publish portable TUN bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-tun-bridge.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: gput-tun-bridge
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate portable TUN adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("Cargo.toml")
          source = manifest.read_text()
          if 'tun = "0.8.14"' not in source:
              marker = 'tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }\n'
              if marker not in source:
                  raise SystemExit("Cargo.toml dependency insertion point moved")
              source = source.replace(marker, marker + 'tun = "0.8.14"\n', 1)
              manifest.write_text(source)
          PY

          cat > src/bin/gput-packetd.rs <<'RS'
          use std::{
              io::{Read, Write},
              net::Ipv4Addr,
          };

          use anyhow::{Context, Result};
          use clap::Parser;
          use gput::packet::{GpuPacketEngine, PacketEngine, PacketEngineConfig, RawPacket};

          #[derive(Debug, Parser)]
          #[command(
              name = "gput-packetd",
              version,
              about = "Serve the GPU TCP fast path through a portable L3 TUN interface"
          )]
          struct Cli {
              #[arg(long, default_value = "10.77.0.1")]
              local: Ipv4Addr,

              #[arg(long, default_value = "10.77.0.2")]
              peer: Ipv4Addr,

              #[arg(long, default_value = "255.255.255.0")]
              netmask: Ipv4Addr,

              #[arg(long, default_value_t = 1500)]
              mtu: u16,

              #[arg(long, default_value_t = 8080)]
              listen_port: u16,

              #[arg(long, default_value_t = 256)]
              gpu_batch_capacity: usize,

              #[arg(long, default_value_t = 4096)]
              flow_capacity: usize,
          }

          fn main() -> Result<()> {
              let cli = Cli::parse();
              let engine = GpuPacketEngine::new(PacketEngineConfig {
                  max_batch_size: cli.gpu_batch_capacity,
                  flow_capacity: cli.flow_capacity,
                  listen_port: cli.listen_port,
              })?;

              let mut tun_config = tun::Configuration::default();
              tun_config
                  .address(cli.local)
                  .destination(cli.peer)
                  .netmask(cli.netmask)
                  .mtu(cli.mtu)
                  .up();

              #[cfg(target_os = "linux")]
              tun_config.platform_config(|config| {
                  config.ensure_root_privileges(true);
              });

              let mut device = tun::create(&tun_config).context("failed to create TUN interface")?;
              eprintln!(
                  "gput packet path ready: curl --noproxy '*' http://{}:{}/plaintext",
                  cli.peer, cli.listen_port
              );

              let mut buffer = vec![0_u8; usize::from(cli.mtu).max(2048)];
              loop {
                  let packet_len = device.read(&mut buffer).context("failed to read TUN packet")?;
                  if packet_len == 0 {
                      continue;
                  }

                  let packet = RawPacket::new(buffer[..packet_len].to_vec())?;
                  for response in engine.process_batch(&[packet])?.into_iter().flatten() {
                      device
                          .write_all(response.as_bytes())
                          .context("failed to inject GPU response into TUN")?;
                  }
              }
          }
          RS

      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Resolve TUN dependency without updating existing packages
        run: cargo +1.97.1 check --all-targets --all-features

      - name: Format
        run: cargo +1.97.1 fmt

      - name: Clippy
        run: cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +1.97.1 test --locked --all-features

      - name: Build all binaries
        run: cargo +1.97.1 build --locked --bins

      - name: Install or locate Lavapipe
        shell: bash
        run: |
          set -euo pipefail
          if ! find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit \
            2>/dev/null | grep --quiet .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
          fi

      - name: Curl through TUN into GPU TCP
        shell: bash
        run: |
          set -euo pipefail
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          runtime_dir="$(mktemp -d)"
          chmod 755 "$runtime_dir"
          packet_log="$(mktemp)"
          packet_pid=""

          cleanup() {
            local status=$?
            if [[ -n "$packet_pid" ]]; then
              sudo kill "$packet_pid" 2>/dev/null || true
              wait "$packet_pid" 2>/dev/null || true
            fi
            if (( status != 0 )); then
              echo '===== gput-packetd log =====' >&2
              cat "$packet_log" >&2 || true
              echo '===== routes =====' >&2
              ip route >&2 || true
            fi
            rm -rf "$runtime_dir" "$packet_log"
            exit "$status"
          }
          trap cleanup EXIT

          sudo env \
            WGPU_BACKEND=vulkan \
            VK_DRIVER_FILES="$lvp_icd" \
            VK_ICD_FILENAMES="$lvp_icd" \
            XDG_RUNTIME_DIR="$runtime_dir" \
            LIBGL_ALWAYS_SOFTWARE=true \
            GALLIUM_DRIVER=llvmpipe \
            target/debug/gput-packetd \
              --local 10.77.0.1 \
              --peer 10.77.0.2 \
              --listen-port 18088 \
              >"$packet_log" 2>&1 &
          packet_pid=$!

          expected="$(mktemp)"
          actual="$(mktemp)"
          printf 'Hello, World!\n' > "$expected"
          success=false
          for _ in $(seq 1 60); do
            if curl --noproxy '*' --silent --show-error --fail --max-time 1 \
              http://10.77.0.2:18088/plaintext > "$actual" 2>/dev/null; then
              success=true
              break
            fi
            if ! sudo kill -0 "$packet_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done

          [[ "$success" == true ]]
          cmp "$expected" "$actual"
          ip route get 10.77.0.2
          rm -f "$expected" "$actual"
          trap - EXIT
          sudo kill "$packet_pid" 2>/dev/null || true
          wait "$packet_pid" 2>/dev/null || true
          packet_pid=""
          rm -rf "$runtime_dir" "$packet_log"

      - name: Publish portable bridge directly to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/publish-tun-bridge.yml
          git add -- Cargo.toml Cargo.lock src/bin/gput-packetd.rs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: bridge host packets into GPU TCP with TUN"
          git push origin HEAD:main
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish green bridge status
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.publish.outputs.new_sha }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${NEW_SHA}" \
            -f state=success \
            -f context=gput/tun-preflight \
            -f description='curl traversed TUN -> GPU TCP -> TUN successfully' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Dispatch normal CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref=main
