name: validate GPU packet engine

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/packet-repair.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: gput-packet-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark preflight pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=gput/packet-preflight \
            -f description='formatting and validating GPU TCP packet engine' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Apply wgpu 30 readback fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/packet/mod.rs")
          source = path.read_text()
          old_signature = "fn map_read(device: &wgpu::Device, buffer: &wgpu::Buffer) -> Result<wgpu::BufferView<'_>> {"
          new_signature = "fn map_read(device: &wgpu::Device, buffer: &wgpu::Buffer) -> Result<wgpu::BufferView> {"
          if old_signature not in source:
              raise SystemExit("expected packet readback signature was not found")
          source = source.replace(old_signature, new_signature, 1)
          old_return = "    Ok(slice.get_mapped_range())\n"
          new_return = "    Ok(slice.get_mapped_range()?)\n"
          if old_return not in source:
              raise SystemExit("expected mapped-range return was not found")
          path.write_text(source.replace(old_return, new_return, 1))
          PY

      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Format the tree
        run: cargo +1.97.1 fmt

      - name: Clippy
        run: cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +1.97.1 test --locked --all-features

      - name: Build all binaries
        run: cargo +1.97.1 build --locked --bins

      - name: Install or locate Lavapipe
        shell: bash
        run: |
          set -euo pipefail
          if ! find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit \
            2>/dev/null | grep --quiet .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
          fi

      - name: Execute TCP handshake and HTTP response in the packet shader
        shell: bash
        run: |
          set -euo pipefail
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          chmod 700 "$runtime_dir"
          env \
            WGPU_BACKEND=vulkan \
            VK_DRIVER_FILES="$lvp_icd" \
            VK_ICD_FILENAMES="$lvp_icd" \
            XDG_RUNTIME_DIR="$runtime_dir" \
            LIBGL_ALWAYS_SOFTWARE=true \
            GALLIUM_DRIVER=llvmpipe \
            target/debug/gput-packet-demo

      - name: Publish validated repair directly to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/packet-repair.yml
          git add -- \
            src/bin/gput-bench.rs \
            src/bin/gput-packet-demo.rs \
            src/network.rs \
            src/packet/mod.rs \
            src/processor/shader_strings.rs

          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: validate GPU packet engine"
          git push origin HEAD:main

          new_sha="$(git rev-parse HEAD)"
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"

      - name: Mark validated commit green
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.publish.outputs.new_sha }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${NEW_SHA}" \
            -f state=success \
            -f context=gput/packet-preflight \
            -f description='fmt, clippy, tests, build and GPU TCP handshake passed' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Dispatch normal CI on validated main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref=main

      - name: Mark failed preflight red
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=gput/packet-preflight \
            -f description='GPU packet preflight failed; inspect workflow logs' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
