name: publish proven borrowed packet output

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/borrowed-packet-output-v4.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: gput-borrowed-packet-output
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark final publication pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=gput/borrowed-packet-output \
            -f description='replaying the proven patch and publishing it without bootstrap debris' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Normalize and apply the proven patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/borrowed-packet-output.py')
          source = path.read_text()
          guard = '''if "decode_wave_outputs(" in source:
              raise SystemExit("not every GPU decode call was converted to borrowed output")
          '''
          source = source.replace(guard, '', 1)
          source = source.replace(
              '        spare_packets.extend(batch.drain(..));\n',
              '        spare_packets.append(&mut batch);\n',
              1,
          )
          if 'spare_packets.extend(batch.drain(..));' in source:
              raise SystemExit('legacy packet-pool move survived bootstrap repair')
          path.write_text(source)
          PY
          python3 scripts/borrowed-packet-output.py

      - name: Install Rust and Lavapipe
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          if ! find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit \
            2>/dev/null | grep --quiet .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
          fi

      - name: Re-run the source and protocol gauntlet
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt
          cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --locked --all-features
          cargo +1.97.1 build --release --locked --bins

          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          chmod 700 "$runtime_dir"
          common=(
            WGPU_BACKEND=vulkan
            VK_DRIVER_FILES="$lvp_icd"
            VK_ICD_FILENAMES="$lvp_icd"
            XDG_RUNTIME_DIR="$runtime_dir"
            LIBGL_ALWAYS_SOFTWARE=true
            GALLIUM_DRIVER=llvmpipe
          )
          env "${common[@]}" target/release/gput-doctor
          env "${common[@]}" target/release/gput-packet-demo
          env "${common[@]}" \
            target/release/gput-packet-bench \
              --backend both \
              --flows 256 \
              --requests-per-flow 8 \
              --warmup-requests-per-flow 1 \
              --batch-size 256 \
              --flow-capacity 1024 \
              --flow-probe-limit 64 \
              --json > packet-borrowed-proof.json

          python3 - <<'PY'
          import json
          with open('packet-borrowed-proof.json', encoding='utf-8') as source:
              rows = {row['backend']: row for row in json.load(source)['results']}
          assert set(rows) == {'cpu-packet', 'gpu-packet'}, rows
          assert all(row['requests'] == 2048 for row in rows.values()), rows
          PY

      - name: Re-prove borrowed output with a real TUN client
        shell: bash
        run: |
          set -euo pipefail
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          runtime_dir="$(mktemp -d)"
          work_dir="$(mktemp -d)"
          chmod 755 "$runtime_dir"
          packet_pid=""
          cleanup() {
            if [[ -n "$packet_pid" ]]; then
              sudo kill "$packet_pid" 2>/dev/null || true
              wait "$packet_pid" 2>/dev/null || true
            fi
            rm -rf "$runtime_dir" "$work_dir"
          }
          trap cleanup EXIT

          sudo env \
            WGPU_BACKEND=vulkan \
            VK_DRIVER_FILES="$lvp_icd" \
            VK_ICD_FILENAMES="$lvp_icd" \
            XDG_RUNTIME_DIR="$runtime_dir" \
            LIBGL_ALWAYS_SOFTWARE=true \
            GALLIUM_DRIVER=llvmpipe \
            target/release/gput-packetd \
              --backend gpu \
              --local 10.79.0.1 \
              --peer 10.79.0.2 \
              --listen-port 18090 \
              --batch-capacity 64 \
              --batch-wait-micros 250 \
              --flow-capacity 512 \
              --flow-probe-limit 64 \
              --stats-interval-secs 0 \
              >"$work_dir/packetd.log" 2>&1 &
          packet_pid=$!

          success=false
          for _ in $(seq 1 100); do
            if curl --noproxy '*' --silent --show-error --fail --max-time 2 \
              --dump-header "$work_dir/headers" \
              --output "$work_dir/body" \
              http://10.79.0.2:18090/plaintext 2>/dev/null; then
              success=true
              break
            fi
            if ! sudo kill -0 "$packet_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if [[ "$success" != true ]]; then
            cat "$work_dir/packetd.log" >&2 || true
            exit 1
          fi
          printf 'Hello, World!\n' > "$work_dir/expected"
          cmp "$work_dir/expected" "$work_dir/body"
          tr -d '\r' < "$work_dir/headers" |
            grep --fixed-strings --line-regexp 'X-Gput-Backend: gpu-packet' >/dev/null

      - name: Publish and remove every piece of scaffolding
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/borrowed-packet-output.yml \
            .github/workflows/borrowed-packet-output-v2.yml \
            .github/workflows/borrowed-packet-output-v3.yml \
            .github/workflows/borrowed-packet-output-v4.yml \
            scripts/borrowed-packet-output.py
          git add -- \
            README.md \
            docs/GPU_NETWORKING.md \
            src/bin/gput-packetd.rs \
            src/packet/mod.rs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "perf: stream mapped packet output and pool TUN ingress"
          git push origin HEAD:main
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark validated commit green
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.publish.outputs.new_sha }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${NEW_SHA}" \
            -f state=success \
            -f context=gput/borrowed-packet-output \
            -f description='mapped output streamed to TUN, ingress reused, full packet proof passed' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Dispatch permanent validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/packet-proof.yml/dispatches" -f ref=main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/macos.yml/dispatches" -f ref=main

      - name: Mark failed final publication red
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=gput/borrowed-packet-output \
            -f description='final borrowed-output publication failed; inspect the linked run' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
