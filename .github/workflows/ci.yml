name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  statuses: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run the whole Rust and GPU gauntlet
        id: checks
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > ci.log
          failed=0

          run_check() {
            local label="$1"
            shift
            printf '\n===== %s =====\n' "$label" | tee -a ci.log
            "$@" 2>&1 | tee -a ci.log
            local status=${PIPESTATUS[0]}
            if (( status != 0 )); then
              failed=1
            fi
            return "$status"
          }

          ensure_lavapipe() {
            if find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit \
              2>/dev/null | grep --quiet .; then
              return 0
            fi

            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
          }

          run_check "install Rust 1.97.1" \
            rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          setup_status=$?

          if (( setup_status == 0 )); then
            run_check "cargo fmt --check" \
              cargo +1.97.1 fmt --check
            run_check "cargo clippy" \
              cargo +1.97.1 clippy --all-targets --all-features -- -D warnings
            run_check "cargo test" \
              cargo +1.97.1 test --all-features
            run_check "cargo build" \
              cargo +1.97.1 build --bin gput
            build_status=$?

            if (( build_status == 0 )); then
              run_check "CPU socket smoke test" \
                env GPUT_SMOKE_PORT=18080 \
                bash scripts/smoke.sh cpu target/debug/gput

              run_check "install or locate Lavapipe" ensure_lavapipe
              lavapipe_status=$?

              if (( lavapipe_status == 0 )); then
                lvp_icd="$(
                  find /usr/share/vulkan/icd.d -maxdepth 1 \
                    -name 'lvp_icd*.json' -print -quit
                )"
                runtime_dir="$(mktemp -d)"
                chmod 700 "$runtime_dir"

                run_check "GPU socket smoke test through Lavapipe" \
                  env \
                    GPUT_SMOKE_PORT=18081 \
                    WGPU_BACKEND=vulkan \
                    VK_DRIVER_FILES="$lvp_icd" \
                    VK_ICD_FILENAMES="$lvp_icd" \
                    XDG_RUNTIME_DIR="$runtime_dir" \
                    LIBGL_ALWAYS_SOFTWARE=true \
                    GALLIUM_DRIVER=llvmpipe \
                  bash scripts/smoke.sh gpu target/debug/gput

                rm -rf "$runtime_dir"
              fi
            fi
          else
            printf '\nRust setup failed; cargo and smoke checks were skipped.\n' | tee -a ci.log
          fi

          if (( failed == 0 )); then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the generated dependency lock
        if: steps.checks.outputs.result == 'success'
        shell: bash
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock is already tracked"
            exit 0
          fi

          test -f Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock
          git commit -m "chore: lock the dependency reactor"
          git push origin HEAD:main

      - name: Preserve generated Cargo.lock
        if: always() && hashFiles('Cargo.lock') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ steps.checks.outputs.result }}
        shell: bash
        run: |
          state="$CHECK_RESULT"
          if [[ "$state" != "success" ]]; then
            state="failure"
            description="Rust, protocol, or GPU smoke checks failed"
          else
            description="format, Clippy, tests, and CPU/GPU smoke passed"
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="gput/ci" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Open a failure log issue
        if: always() && steps.checks.outputs.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          touch ci.log
          short_sha="${GITHUB_SHA:0:7}"
          title="CI failed on ${short_sha}"
          existing_issue="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "${title} in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$existing_issue" ]]; then
            exit 0
          fi

          {
            echo "The direct-to-main quality goblin rejected commit \`${GITHUB_SHA}\`."
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            tail -c 50000 ci.log
            echo '```'
          } > ci-issue.md

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body-file ci-issue.md

      - name: Close superseded failure-log issues
        if: always() && steps.checks.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'CI failed on in:title' \
            --json number \
            --jq '.[].number' |
          while read -r issue_number; do
            [[ -z "$issue_number" ]] && continue
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by green CI on \`${GITHUB_SHA}\`."
          done

      - name: Fail the workflow when checks failed
        if: always() && steps.checks.outputs.result != 'success'
        run: exit 1
