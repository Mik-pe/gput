name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run the whole Rust and GPU gauntlet
        id: checks
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > ci.log
          failed=0

          run_check() {
            local label="$1"
            shift
            printf '\n===== %s =====\n' "$label" | tee -a ci.log
            "$@" 2>&1 | tee -a ci.log
            local status=${PIPESTATUS[0]}
            if (( status != 0 )); then
              failed=1
            fi
            return "$status"
          }

          ensure_lavapipe() {
            if find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit \
              2>/dev/null | grep --quiet .; then
              return 0
            fi

            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
          }

          tun_gpu_smoke() {
            local lvp_icd="$1"
            local runtime_dir="$2"
            local packet_log expected actual packet_pid success
            packet_log="$(mktemp)"
            expected="$(mktemp)"
            actual="$(mktemp)"
            packet_pid=""
            success=false

            cleanup_tun_smoke() {
              if [[ -n "$packet_pid" ]]; then
                sudo kill "$packet_pid" 2>/dev/null || true
                wait "$packet_pid" 2>/dev/null || true
              fi
              rm -f "$packet_log" "$expected" "$actual"
            }

            sudo env \
              WGPU_BACKEND=vulkan \
              VK_DRIVER_FILES="$lvp_icd" \
              VK_ICD_FILENAMES="$lvp_icd" \
              XDG_RUNTIME_DIR="$runtime_dir" \
              LIBGL_ALWAYS_SOFTWARE=true \
              GALLIUM_DRIVER=llvmpipe \
              target/debug/gput-packetd \
                --local 10.77.0.1 \
                --peer 10.77.0.2 \
                --listen-port 18088 \
                >"$packet_log" 2>&1 &
            packet_pid=$!

            printf 'Hello, World!\n' > "$expected"
            for _ in $(seq 1 60); do
              if curl --noproxy '*' --silent --show-error --fail --max-time 1 \
                http://10.77.0.2:18088/plaintext > "$actual" 2>/dev/null; then
                success=true
                break
              fi
              if ! sudo kill -0 "$packet_pid" 2>/dev/null; then
                break
              fi
              sleep 0.1
            done

            if [[ "$success" != true ]]; then
              cat "$packet_log" >&2 || true
              ip route >&2 || true
              cleanup_tun_smoke
              return 1
            fi

            cmp "$expected" "$actual" || {
              cleanup_tun_smoke
              return 1
            }
            ip route get 10.77.0.2 || {
              cleanup_tun_smoke
              return 1
            }
            cleanup_tun_smoke
            return 0
          }

          run_check "install Rust 1.97.1" \
            rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          setup_status=$?

          if (( setup_status == 0 )); then
            run_check "cargo fmt --check" \
              cargo +1.97.1 fmt --check
            run_check "cargo clippy --locked" \
              cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
            run_check "cargo test --locked" \
              cargo +1.97.1 test --locked --all-features
            run_check "cargo build --locked" \
              cargo +1.97.1 build --locked --bins
            build_status=$?

            if (( build_status == 0 )); then
              run_check "CPU socket smoke test" \
                env GPUT_SMOKE_PORT=18080 \
                bash scripts/smoke.sh cpu target/debug/gput

              run_check "install or locate Lavapipe" ensure_lavapipe
              lavapipe_status=$?

              if (( lavapipe_status == 0 )); then
                lvp_icd="$(
                  find /usr/share/vulkan/icd.d -maxdepth 1 \
                    -name 'lvp_icd*.json' -print -quit
                )"
                runtime_dir="$(mktemp -d)"
                chmod 755 "$runtime_dir"

                run_check "GPU socket smoke test through Lavapipe" \
                  env \
                    GPUT_SMOKE_PORT=18081 \
                    WGPU_BACKEND=vulkan \
                    VK_DRIVER_FILES="$lvp_icd" \
                    VK_ICD_FILENAMES="$lvp_icd" \
                    XDG_RUNTIME_DIR="$runtime_dir" \
                    LIBGL_ALWAYS_SOFTWARE=true \
                    GALLIUM_DRIVER=llvmpipe \
                  bash scripts/smoke.sh gpu target/debug/gput

                run_check "GPU TCP packet demo through Lavapipe" \
                  env \
                    WGPU_BACKEND=vulkan \
                    VK_DRIVER_FILES="$lvp_icd" \
                    VK_ICD_FILENAMES="$lvp_icd" \
                    XDG_RUNTIME_DIR="$runtime_dir" \
                    LIBGL_ALWAYS_SOFTWARE=true \
                    GALLIUM_DRIVER=llvmpipe \
                  target/debug/gput-packet-demo

                run_check "curl through TUN into GPU TCP" \
                  tun_gpu_smoke "$lvp_icd" "$runtime_dir"

                rm -rf "$runtime_dir"
              fi
            fi
          else
            printf '\nRust setup failed; cargo and smoke checks were skipped.\n' | tee -a ci.log
          fi

          if (( failed == 0 )); then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ steps.checks.outputs.result }}
        shell: bash
        run: |
          state="$CHECK_RESULT"
          if [[ "$state" != "success" ]]; then
            state="failure"
            description="Rust, benchmark, sockets, TUN, or GPU packet checks failed"
          else
            description="build, sockets, TUN and GPU TCP fast path passed"
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="gput/ci" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Open a failure log issue
        if: always() && steps.checks.outputs.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          touch ci.log
          short_sha="${GITHUB_SHA:0:7}"
          title="CI failed on ${short_sha}"
          existing_issue="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "${title} in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$existing_issue" ]]; then
            exit 0
          fi

          {
            echo "The direct-to-main quality goblin rejected commit \`${GITHUB_SHA}\`."
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            tail -c 50000 ci.log
            echo '```'
          } > ci-issue.md

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body-file ci-issue.md

      - name: Close superseded failure-log issues
        if: always() && steps.checks.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'CI failed on in:title' \
            --json number \
            --jq '.[].number' |
          while read -r issue_number; do
            [[ -z "$issue_number" ]] && continue
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by green CI on \`${GITHUB_SHA}\`."
          done

      - name: Fail the workflow when checks failed
        if: always() && steps.checks.outputs.result != 'success'
        run: exit 1
